name: CI

"on": [push, pull_request]

# Same-repo branches fire both a `push` and a `pull_request` (synchronize)
# event for the identical commit, producing two duplicate `check-and-test`
# entries in the PR's checks list (both green, but cosmetically looks like
# an ambiguous/unstable merge status). Group by workflow+ref and cancel the
# stale run so only the latest one for a given ref actually completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # `npm ci` is itself the lockfile-drift guard: it hard-fails (EUSAGE) when
      # package.json and package-lock.json are out of sync, which is exactly the
      # dev-vs-CI divergence that corrupted the lockfile in #40 (see issue #42).
      # A separate `npm install --package-lock-only` + `git diff` guard was tried
      # but is non-deterministic here: npm re-resolves the wasm-glue optional
      # deps (@emnapi/*) differently depending on install context, so it produced
      # false drift on every run. `npm ci` is the robust check.
      - run: npm ci
      - run: npm run check
      - run: npm test
