name: CI

# Only run on push for main (post-merge / direct pushes), never for feature
# branches -- a feature branch's commits are already covered by the
# `pull_request` trigger below. Triggering on every branch push AND its
# matching pull_request (synchronize) event produced two duplicate
# `check-and-test` entries for the identical commit in the PR checks list.
# An earlier attempt fixed this with `concurrency: cancel-in-progress`, but
# that leaves a visible CANCELLED check in the PR's statusCheckRollup, which
# flips `mergeStateStatus` to UNSTABLE -- the exact "merge issues" symptom
# this was meant to fix. Not triggering the redundant run in the first place
# avoids a CANCELLED entry entirely.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    # `pull-requests: write` lets scripts/check-test-duration.sh (#197) post/
    # update a loud PR comment on a hard/soft duration-budget breach via the
    # gh CLI; `contents: read` is the standard minimal read needed for
    # actions/checkout. No other permissions are used by this job.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # `npm ci` is itself the lockfile-drift guard: it hard-fails (EUSAGE) when
      # package.json and package-lock.json are out of sync, which is exactly the
      # dev-vs-CI divergence that corrupted the lockfile in #40 (see issue #42).
      # A separate `npm install --package-lock-only` + `git diff` guard was tried
      # but is non-deterministic here: npm re-resolves the wasm-glue optional
      # deps (@emnapi/*) differently depending on install context, so it produced
      # false drift on every run. `npm ci` is the robust check.
      - run: npm ci
      - run: make audit
      - run: npm run check
      # `make test` wraps `npm test` with a duration-budget check
      # (scripts/check-test-duration.sh, see issues #185/#197): soft
      # breaches surface as loud `::warning::` annotations (and, on a real
      # PR, an @-mention comment) but never fail the build; a HARD breach
      # (~3x the soft per-file threshold, 2x the total-suite one) does fail
      # the build, since that indicates a genuine regression rather than
      # tolerable drift. GH_TOKEN is required for the PR-comment step only;
      # it is a no-op locally with no GH_TOKEN/gh present.
      - run: make test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
