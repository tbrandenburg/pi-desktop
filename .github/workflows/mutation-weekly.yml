name: Mutation Testing (Weekly)

"on":
  workflow_dispatch: {}
  schedule:
    # Monday 03:00 UTC
    - cron: "0 3 * * 1"

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
      - name: File/update mutation gap issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create mutation-gap \
            --description "Weak or regressed Stryker mutation coverage for a file" \
            --color c2e0c6 || true
          node scripts/mutation-issue-sync.mjs --report reports/mutation/mutation.json
