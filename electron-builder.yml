appId: dev.pi.desktop.demo
productName: Pi Desktop Demo

directories:
  output: release
  buildResources: assets

files:
  - dist-renderer/**
  - dist-main/**
  - "!dist-main/**/*.test.js"
  - "!dist-main/**/*.test.js.map"
  - "!dist-main/**/test-support/**"
  - package.json

# First-party pi-package (ADR 0001 §3.5, issue #97): bundles pi-desktop's own
# `read_file`/`list_files` tools as a real, pre-transpiled local pi-package,
# proving the build-time extension-bundling/discovery pipeline end-to-end.
# Resolved at runtime via `process.resourcesPath/pi-packages/*`
# (`src/main/ipc.ts`'s `resolvePiPackagesReadOnlyToolsDir`).
extraResources:
  - from: resources/pi-packages
    to: pi-packages

asar: true
# @earendil-works/pi-ai is ESM-only and loaded via a genuine dynamic
# import() (see the `nativeDynamicImport` comment in chat-service.ts for why
# it's constructed via `new Function(...)` instead of a literal `import()`
# expression -- tsc's CommonJS output would otherwise silently downlevel it
# to a require(), which can never load an ESM module and only fails in the
# compiled/packaged app, never in plain-TS unit tests).

# `make publish` (see Makefile) always creates the GitHub release as a
# normal, published release via `gh release create` -- never a draft.
# electron-builder's own default publish releaseType is "draft", and it
# silently *skips* uploading (exit 0, no error) rather than attaching when
# the existing release's type doesn't match its own releaseType (observed
# real-world during the v0.3.1 CI verification run: both linux/windows jobs
# logged "GitHub release not created ... existingType=release
# publishingType=draft" and uploaded nothing). Setting releaseType: release
# here makes electron-builder's GitHub publisher match `make publish`'s
# release type so `--publish always` (used by .github/workflows/release.yml)
# actually attaches the built artifacts instead of quietly no-op'ing.
publish:
  provider: github
  releaseType: release

linux:
  icon: assets/icon.png
  category: Development
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64

# NOTE: this file's per-target `arch: [universal]` below is silently ignored
# whenever electron-builder is invoked with an explicit CLI target list (e.g.
# `--mac dmg zip`), which defaults to the host runner's own arch instead
# (confirmed on a real v0.3.7 GitHub Actions macos-latest arm64 runner --
# see issue #94). All real mac build invocations (Makefile's `dist-mac`,
# package.json's `dist:mac`, .github/workflows/release.yml's macos-latest
# job) MUST also pass the separate `--universal` CLI flag, or this config's
# `arch: [universal]` has no effect.
mac:
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # Several transitive deps (@earendil-works/pi-tui's own native/darwin/
  # prebuilds/darwin-{arm64,x64}/*.node, @mariozechner/clipboard-darwin-arm64,
  # ...) ship prebuilt native darwin addons as single-arch packages/files with
  # their own runtime loader picking the right one per-process arch --
  # `npm install` unpacks whichever arch-specific optional packages match the
  # *build host's* arch (only arm64 ones on a macos-latest arm64 runner), so
  # the x64 and arm64 intermediate app bundles electron-builder builds before
  # merging into one universal binary end up with byte-identical copies of
  # files that are genuinely single-arch, one per real "unmergeable" package.
  # Rather than allowlisting each such package by name as they're discovered
  # (already hit twice: pi-tui, then @mariozechner/clipboard-darwin-arm64),
  # match every native `.node` file: this check in
  # @electron/universal's dist/cjs/index.js only ever fires when a Mach-O
  # file's SHA is byte-identical across both intermediate builds -- any
  # native module that's genuinely compiled per-arch differently produces
  # different SHAs and gets merged via `lipo` on a completely separate code
  # path instead, so this broad glob can never mask a real dual-arch
  # mismatch, only exempt files that were already proven identical.
  x64ArchFiles: "**/*.node"

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-${version}-${os}-${arch}-setup.${ext}"

portable:
  artifactName: "${productName}-${version}-${os}-${arch}-portable.${ext}"

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
